org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official

# Where btManage-core is checked out, relative to this directory.
btmanage.coreDir=../btManage-core
# Set to true to package without building the Rust core. The app then starts
# and reports that the core is missing.
btmanage.skipRust=false
