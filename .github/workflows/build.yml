name: Build

# Every push and pull request builds the application and keeps the APK as an artifact.
# Pushes to main/master publish a release using the base version from gradle.properties,
# with a numeric suffix when that version has already been used. Pushing a "v1.2.3" tag
# also publishes a release.
#
# With the signing secrets set (see README, "Signing") the release build is signed with your
# key. Without them a debug build is produced instead.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      core_ref:
        description: Branch, tag or commit of btManage-core to build against (default branch if empty)
        required: false
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NDK_VERSION: 4.1.2

jobs:
  prepare:
    name: Prepare version
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: btManage-android

      - name: Choose and reserve the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/* ]]; then
            base_version="$(sed -n 's/^btmanage\.versionName=\(.*\)$/\1/p' btManage-android/gradle.properties | head -n 1 | tr -d '[:space:]')"
            if [[ -z "$base_version" ]]; then
              echo "::error::Could not read btmanage.versionName from gradle.properties."
              exit 1
            fi

            tags="$(gh api --paginate "repos/$GH_REPO/tags?per_page=100" --jq '.[].name')"
            suffix=0
            while :; do
              if (( suffix == 0 )); then
                version="$base_version"
              else
                version="$base_version.$suffix"
              fi
              tag="v$version"

              if grep -Fqx "$tag" <<< "$tags"; then
                suffix=$((suffix + 1))
                continue
              fi

              if output="$(gh api --method POST "repos/$GH_REPO/git/refs" \
                -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" 2>&1)"; then
                break
              elif [[ "$output" == *"Reference already exists"* ]]; then
                tags+=$'\n'"$tag"
                suffix=$((suffix + 1))
              else
                echo "$output" >&2
                exit 1
              fi
            done
          else
            version="0.0.${GITHUB_RUN_NUMBER}"
          fi

          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){2,3}$ ]]; then
            echo "::error::Release version '$version' must contain three or four numeric components."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Android
    # btManage-core is private. Pull requests from forks do not get its token, so they are skipped.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: prepare
    runs-on: ubuntu-latest
    env:
      HAS_CORE_TOKEN: ${{ secrets.CORE_REPO_TOKEN != '' }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Require the core token
        if: env.HAS_CORE_TOKEN != 'true'
        run: |
          echo "::error::Secret CORE_REPO_TOKEN is not set. Add a fine-grained token with read access to the contents of btManage-core (Settings, Secrets and variables, Actions)."
          exit 1

      # The two repositories sit side by side, as on a developer machine.
      - uses: actions/checkout@v7
        with:
          path: btManage-android

      - name: Check out the core
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/btManage-core
          ref: ${{ inputs.core_ref }}
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: btManage-core

      - name: Record the versions
        run: echo "Version $VERSION, built against btManage-core \`$(git -C btManage-core rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: btManage-core

      - name: Install cargo-ndk
        run: cargo ndk --version 2>/dev/null | grep -q "$CARGO_NDK_VERSION" || cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked

      - uses: gradle/actions/setup-gradle@v6

      # The keystore lives in a secret as base64 text. It is written to a temporary file
      # for the build and never enters the repository or the artifacts.
      - name: Restore the signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "BTM_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      # Builds the Rust core for three ABIs too: see the cargoNdkBuild task in app/build.gradle.kts.
      # The version code only ever grows: Android refuses to install a lower one over a higher.
      - name: Build
        working-directory: btManage-android
        env:
          BTM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BTM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BTM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          chmod +x gradlew
          if [[ "$HAS_KEYSTORE" == true ]]; then task=assembleRelease; variant=release; else task=assembleDebug; variant=debug; fi
          ./gradlew ":app:$task" --no-daemon --stacktrace \
            "-Pbtmanage.versionName=$VERSION" \
            "-Pbtmanage.versionCode=$GITHUB_RUN_NUMBER" \
            "-Pbtmanage.updateRepository=$GITHUB_REPOSITORY"

          mkdir -p "$GITHUB_WORKSPACE/dist"
          suffix=""; [[ "$variant" == debug ]] && suffix="-debug"
          cp app/build/outputs/apk/$variant/app-$variant.apk "$GITHUB_WORKSPACE/dist/btManage-android-$VERSION$suffix.apk"

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@v7
        with:
          name: btManage-android
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi
